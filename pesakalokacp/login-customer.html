<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Area Customer PT. Pesaka Loka Kirana.">
    <title>Login Customer - PT. Pesaka Loka Kirana</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="position-relative d-flex align-items-center justify-content-center" style="min-height: 100vh; overflow-x: hidden;">

    <!-- Background Foto Gudang -->
    <div class="position-absolute top-0 start-0 w-100 h-100 z-0">
        <img src="img/gambarho.jpg" alt="Fasilitas Pesaka" class="w-100 h-100 object-fit-cover">
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(rgba(36,22,20,0.85), rgba(36,22,20,0.95));"></div>
    </div>

    <main class="container position-relative z-2 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4">
                
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-start">
                    
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-inline-block hover-zoom mb-3">
                            <img src="img/Asset 15.svg" alt="Pesaka Logo" height="42">
                        </a>
                        <h1 class="h4 fw-bold color-brand font-serif mb-1">Customer Login</h1>
                        <p class="text-muted small">Masuk untuk melihat rincian dokumen kontainer</p>
                    </div>

                    <!-- Form Login -->
                    <form action="customer-dashboard.html" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold color-brand font-mono">Email / Username</label>
                            <input type="text" class="form-control bg-light border-0 py-2 font-mono" placeholder="nama@perusahaan.com" required>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-bold color-brand font-mono">Password</label>
                                <a href="#" class="text-decoration-none small text-gold font-mono" style="font-size: 0.75rem;">Lupa password?</a>
                            </div>
                            <input type="password" class="form-control bg-light border-0 py-2 font-mono" placeholder="••••••••" required>
                        </div>

                    <a href="customer-dashboard.html" class="btn btn-outline-brand w-100 fw-bold rounded-pill font-mono py-2">Login</a>                    
                    </form>

                    <hr class="text-secondary opacity-25 my-3">

                    <div class="text-center">
                        <p class="text-muted small mb-2">Belum punya akun customer?</p>
                        <a href="register-customer.html" class="text-decoration-none fw-bold color-brand small font-mono">Daftar Akun Baru <i class="bi bi-arrow-right"></i></a>
                    </div>

                </div>

                <footer class="text-center mt-4">
                    <p class="text-white-50 small font-mono m-0" style="font-size: 0.75rem;">&copy; 2026 PT Pesaka Loka Kirana.</p>
                    <a href="portal.html" class="text-white-50 text-decoration-none small font-mono mt-1 d-inline-block" style="font-size: 0.75rem;"><i class="bi bi-arrow-left"></i> Kembali ke Portal Akses</a>
                </footer>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
